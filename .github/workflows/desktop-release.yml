name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.3.2"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      desktop_version: ${{ steps.meta.outputs.desktop_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      update_channel: ${{ steps.meta.outputs.update_channel }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          desktop_version=$(node -e 'const fs = require("node:fs"); const pkg = JSON.parse(fs.readFileSync("apps/desktop/package.json", "utf8")); process.stdout.write(pkg.version);')
          expected_tag="v${desktop_version}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_name="${{ inputs.tag_name }}"
          else
            tag_name="${GITHUB_REF#refs/tags/}"
          fi

          if [ "$tag_name" != "$expected_tag" ]; then
            echo "Expected desktop release tag $expected_tag but received $tag_name" >&2
            exit 1
          fi

          prerelease=false
          update_channel=stable
          if [[ "$desktop_version" == *-* ]]; then
            prerelease=true
            update_channel=beta
          fi

          {
            echo "desktop_version=$desktop_version"
            echo "tag_name=$tag_name"
            echo "prerelease=$prerelease"
            echo "update_channel=$update_channel"
            echo "commit_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          VERSION: ${{ steps.meta.outputs.desktop_version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          COMMIT_SHA: ${{ steps.meta.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $TAG_NAME already exists; keeping existing release notes."
            exit 0
          fi

          release_args=(
            "$TAG_NAME"
            --target "$COMMIT_SHA"
            --title "Tabby ${VERSION}"
            --notes "Tabby ${VERSION} desktop release."
          )
          if [ "$PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"

  mac:
    name: macOS ${{ matrix.arch }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Checkout tabby-control plugin
        uses: actions/checkout@v4
        with:
          repository: coder-zkl1988/tabby-control
          ref: nexu-desktop
          path: ../tabby-control

      - name: Build tabby-control plugin
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir ../tabby-control install --frozen-lockfile
          pnpm --dir ../tabby-control build:nexu
          test -d ../tabby-control/dist-nexu/tabby-control

      - name: Import Apple Developer ID certificate
        shell: bash
        env:
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$APPLE_SIGNING_CERTIFICATE_BASE64" ] || [ -z "$APPLE_SIGNING_CERTIFICATE_PASSWORD" ]; then
            echo "Missing Apple signing certificate secrets" >&2
            exit 1
          fi

          cert_path="$RUNNER_TEMP/tabby-developer-id.p12"
          keychain_path="$RUNNER_TEMP/tabby-signing.keychain-db"
          keychain_password="${APPLE_KEYCHAIN_PASSWORD:-$(uuidgen)}"

          if ! printf '%s' "$APPLE_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$cert_path" 2>/dev/null; then
            printf '%s' "$APPLE_SIGNING_CERTIFICATE_BASE64" | base64 -D > "$cert_path"
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/[ "]//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed and notarized macOS DMG
        env:
          NEXU_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
          NEXU_DESKTOP_SIGNING_IDENTITY: ${{ secrets.APPLE_TEAM_ID }}
          NEXU_APPLE_ID: ${{ secrets.APPLE_ID }}
          NEXU_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NEXU_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NEXU_NOTARY_NO_S3_ACCELERATION: "1"
          NEXU_NOTARY_TIMEOUT: "45m"
          NEXU_DESKTOP_UPDATE_CHANNEL: ${{ needs.prepare-release.outputs.update_channel }}
          NEXU_DESKTOP_BUILD_COMMIT: ${{ needs.prepare-release.outputs.commit_sha }}
          NEXU_DESKTOP_BUILD_SOURCE: "release"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm --filter @nexu/desktop dist:mac:production

      - name: Verify macOS artifact
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare-release.outputs.desktop_version }}
        run: |
          set -euo pipefail
          dmg="apps/desktop/release/tabby-${VERSION}-${ARCH}.dmg"
          app="apps/desktop/release/mac-${ARCH}/Tabby.app"

          test -f "$dmg"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$dmg"
          spctl -a -vv --type exec "$app"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          shasum -a 256 "$dmg" > "apps/desktop/release/tabby-${VERSION}-mac-${ARCH}-sha256.txt"

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabby-${{ needs.prepare-release.outputs.desktop_version }}-mac-${{ matrix.arch }}
          path: |
            apps/desktop/release/tabby-${{ needs.prepare-release.outputs.desktop_version }}-${{ matrix.arch }}.dmg
            apps/desktop/release/latest-mac.yml
            apps/desktop/release/tabby-${{ needs.prepare-release.outputs.desktop_version }}-mac-${{ matrix.arch }}-sha256.txt
          if-no-files-found: error

      - name: Upload macOS assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.desktop_version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG_NAME" \
            "apps/desktop/release/tabby-${VERSION}-${ARCH}.dmg" \
            "apps/desktop/release/tabby-${VERSION}-mac-${ARCH}-sha256.txt" \
            --clobber

  windows:
    name: Windows x64
    needs: prepare-release
    runs-on: windows-latest
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Checkout tabby-control plugin
        uses: actions/checkout@v4
        with:
          repository: coder-zkl1988/tabby-control
          ref: nexu-desktop
          path: ../tabby-control

      - name: Build tabby-control plugin
        shell: pwsh
        run: |
          pnpm --dir ../tabby-control install --frozen-lockfile
          pnpm --dir ../tabby-control build:nexu
          if (-not (Test-Path ../tabby-control/dist-nexu/tabby-control)) {
            throw "Missing tabby-control dist-nexu output"
          }

      - name: Install packaging tools
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        shell: pwsh
        env:
          NEXU_DESKTOP_UPDATE_CHANNEL: ${{ needs.prepare-release.outputs.update_channel }}
          NEXU_DESKTOP_BUILD_SOURCE: release
          NEXU_DESKTOP_BUILD_BRANCH: ${{ needs.prepare-release.outputs.tag_name }}
          NEXU_DESKTOP_BUILD_COMMIT: ${{ needs.prepare-release.outputs.commit_sha }}
          NEXU_DESKTOP_AUTO_UPDATE_ENABLED: "false"
          VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          $env:NEXU_DESKTOP_BUILD_TIME = (Get-Date).ToUniversalTime().ToString('o')
          pnpm --filter @nexu/desktop dist:win

      - name: Prepare Windows release artifacts
        id: artifacts
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare-release.outputs.desktop_version }}
        run: |
          $releaseDir = "apps/desktop/release"
          $artifactDir = "apps/desktop/release-artifacts-win"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Get-ChildItem -Path $artifactDir -File -ErrorAction SilentlyContinue | Remove-Item -Force

          $sourceInstaller = Join-Path $releaseDir "tabby-setup-$env:VERSION-x64.exe"
          if (-not (Test-Path $sourceInstaller)) {
            throw "Missing Windows installer: $sourceInstaller"
          }

          $versionedInstaller = "tabby-setup-$env:VERSION-win-x64.exe"
          $checksumFile = "tabby-$env:VERSION-win-x64-sha256.txt"
          Copy-Item $sourceInstaller (Join-Path $artifactDir $versionedInstaller)
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $artifactDir $versionedInstaller)).Hash.ToLowerInvariant()
          "$hash  $versionedInstaller" | Out-File -FilePath (Join-Path $artifactDir $checksumFile) -Encoding ascii

          "versioned_installer=$versionedInstaller" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum_file=$checksumFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabby-${{ needs.prepare-release.outputs.desktop_version }}-win-x64
          path: |
            apps/desktop/release-artifacts-win/${{ steps.artifacts.outputs.versioned_installer }}
            apps/desktop/release-artifacts-win/${{ steps.artifacts.outputs.checksum_file }}
          if-no-files-found: error

      - name: Upload Windows assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION: ${{ needs.prepare-release.outputs.desktop_version }}
        shell: pwsh
        run: |
          gh release upload $env:TAG_NAME `
            "apps/desktop/release-artifacts-win/${{ steps.artifacts.outputs.versioned_installer }}" `
            "apps/desktop/release-artifacts-win/${{ steps.artifacts.outputs.checksum_file }}" `
            --clobber

  summary:
    name: Release summary
    needs: [prepare-release, mac, windows]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check release result
        env:
          MAC_RESULT: ${{ needs.mac.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          PREPARE_RELEASE_RESULT: ${{ needs.prepare-release.result }}
        run: |
          set -euo pipefail
          echo "prepare release result: $PREPARE_RELEASE_RESULT"
          echo "macOS result: $MAC_RESULT"
          echo "Windows result: $WINDOWS_RESULT"
          test "$PREPARE_RELEASE_RESULT" = "success"
          test "$MAC_RESULT" = "success"
          test "$WINDOWS_RESULT" = "success"
